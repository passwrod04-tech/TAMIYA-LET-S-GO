<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamiya Mini 4WD Full Custom - Fixed & Playable</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0a0a0a; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.4s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #222; border-top: 5px solid #ff4444;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-title { color: #ff4444; font-size: 1.8rem; margin: 0; letter-spacing: 2px; font-weight: 800; }
        .loading-text { color: #aaa; margin-top: 8px; font-size: 0.9rem; font-family: monospace; }

        /* UI Panels */
        .ui-panel { position: absolute; z-index: 10; background: rgba(15, 15, 20, 0.88); border: 1px solid #444; border-radius: 8px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        #parts-selector { top: 20px; left: 20px; width: 330px; max-height: 85vh; overflow-y: auto; }
        #stats-panel { top: 20px; right: 20px; width: 230px; }
        #race-ui { bottom: 25px; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
        
        h3 { margin: 0 0 10px 0; color: #ff4444; border-bottom: 1px solid #444; padding-bottom: 5px; text-transform: uppercase; font-size: 1.1rem; }
        .step-title { font-size: 0.95rem; color: #ffca28; margin-bottom: 10px; font-weight: bold; }
        
        .item-btn { display: block; width: 100%; padding: 10px; margin: 6px 0; background: #222; border: 1px solid #555; color: white; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.2s; }
        .item-btn:hover { background: #d32f2f; border-color: #ff5252; transform: translateY(-1px); }
        
        .stat-bar { margin: 8px 0; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .stat-val { font-weight: bold; color: #00e676; }
        .btn-action { background: #e53935; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1rem; margin: 0 4px; transition: 0.2s; }
        .btn-action:hover { background: #ff5252; }

        #co-message { color: #ff1744; font-weight: bold; font-size: 1.4rem; display: none; margin-bottom: 8px; animation: blink 0.6s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }
    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 class="loading-title">Tamiya Mini 4WD</h2>
        <div id="loading-text" class="loading-text">กำลังโหลดสนามแข่ง 3D...</div>
    </div>

    <div id="parts-selector" class="ui-panel">
        <h3>Garage Builder</h3>
        <div id="step-desc" class="step-title">ขั้นตอนที่ 1: เลือก Chassis</div>
        <div id="options-list"></div>
    </div>

    <div id="stats-panel" class="ui-panel">
        <h3>Car Stats</h3>
        <div class="stat-bar">Speed: <span id="st-speed" class="stat-val">0</span></div>
        <div class="stat-bar">Accel: <span id="st-accel" class="stat-val">0</span></div>
        <div class="stat-bar">Weight: <span id="st-weight" class="stat-val">0 g</span></div>
        <div class="stat-bar">Stability: <span id="st-stab" class="stat-val">0</span></div>
        <br>
        <button id="go-race-btn" class="btn-action" style="width: 100%; display: none;" onclick="startRaceMode()">เข้าสู่สนามแข่ง!</button>
    </div>

    <div id="race-ui" class="ui-panel">
        <div id="co-message">⚠️ COURSE OUT! (หลุดโค้ง)</div>
        <h2 style="margin: 0 0 5px 0; color: #00e676; font-family: monospace; font-size: 2.2rem;" id="timer">00:00:00</h2>
        <div id="lap-counter" style="margin-bottom: 12px; font-weight: bold;">Lap: 0 / 3</div>
        <button class="btn-action" onclick="toggleRun()" id="btn-run">ปล่อยรถ</button>
        <button class="btn-action" style="background: #555;" onclick="resetGame()">แต่งรถใหม่</button>
    </div>

    <div id="canvas-container"></div>

<script>
// --- 0. LOADING SCREEN SYSTEM ---
function hideLoadingScreen() {
    const loader = document.getElementById('loading-screen');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 400);
}

function showLoadingScreen(msg, duration, callback) {
    const loader = document.getElementById('loading-screen');
    document.getElementById('loading-text').innerText = msg;
    loader.style.display = 'flex';
    loader.style.opacity = '1';
    
    setTimeout(() => {
        if (callback) callback();
        hideLoadingScreen();
    }, duration);
}

// --- 1. SETUP SCENE & CAMERA ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111116);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3.5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.3, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(10, 20, 15);
light.castShadow = true;
scene.add(light);

const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
scene.add(grid);

// --- 2. PARTS DATA ---
const assemblySteps = [
    { key: 'chassis', name: 'Chassis (แชสซี)', items: [
        { name: 'AR Chassis', speed: 5, accel: 6, weight: 15, stab: 7, color: 0x222222 },
        { name: 'MA Chassis', speed: 6, accel: 7, weight: 18, stab: 8, color: 0x1565c0 },
        { name: 'FM-A Chassis', speed: 6, accel: 8, weight: 16, stab: 6, color: 0xc62828 }
    ]},
    { key: 'motor', name: 'Motor (มอเตอร์)', items: [
        { name: 'Atomic-Tuned', speed: 12, accel: 10, weight: 10, stab: 2, color: 0xef6c00 },
        { name: 'Hyper-Dash', speed: 22, accel: 18, weight: 11, stab: -2, color: 0xd84315 },
        { name: 'Mach-Dash', speed: 28, accel: 15, weight: 10, stab: -5, color: 0x1565c0 }
    ]},
    { key: 'gears', name: 'Gear Set (ชุดเฟือง)', items: [
        { name: 'Standard 4:1 Gear', speed: 4, accel: 8, weight: 2, stab: 0, color: 0xffee58 },
        { name: 'High Speed 3.5:1 Gear', speed: 8, accel: 4, weight: 2, stab: 0, color: 0x66bb6a }
    ]},
    { key: 'shaft', name: 'Drive Shaft (เพลาขับ)', items: [
        { name: 'Stock Shaft', speed: 1, accel: 1, weight: 3, stab: 0, color: 0xaaaaaa },
        { name: 'Hollow Propeller Shaft', speed: 3, accel: 3, weight: 1, stab: 1, color: 0xff4081 }
    ]},
    { key: 'bearings', name: 'Bearings (ลูกปืน)', items: [
        { name: 'Plastic Bushings', speed: 1, accel: 1, weight: 1, stab: 0, color: 0x888888 },
        { name: 'HG Ball Bearings 620', speed: 6, accel: 5, weight: 3, stab: 2, color: 0x00e676 }
    ]},
    { key: 'wheels', name: 'Wheels (ล้อ)', items: [
        { name: 'Small Dia. Dish Wheels', speed: 2, accel: 8, weight: 6, stab: 4, color: 0xffffff },
        { name: 'Large Dia. Narrow Wheels', speed: 8, accel: 2, weight: 8, stab: 1, color: 0xffb300 }
    ]},
    { key: 'tires', name: 'Tires (ยาง)', items: [
        { name: 'Super Hard Rubber Tires', speed: 4, accel: 4, weight: 4, stab: 5, color: 0x111111 },
        { name: 'Maroon Low Friction Tires', speed: 7, accel: 2, weight: 3, stab: 2, color: 0x880e4f }
    ]},
    { key: 'plates', name: 'Plates (กันชนแผ่นยึด)', items: [
        { name: 'Front & Rear FRP Stay', speed: 2, accel: 0, weight: 8, stab: 6, color: 0x37474f },
        { name: 'Carbon Multi-Reinforcing Plate', speed: 3, accel: 1, weight: 4, stab: 10, color: 0x111111 }
    ]},
    { key: 'rollers', name: 'Rollers (ลูกกลิ้ง)', items: [
        { name: 'Plastic Rollers 13mm', speed: 2, accel: 1, weight: 2, stab: 4, color: 0x00bcd4 },
        { name: 'Aluminum Ball-Race Rollers 19mm', speed: 6, accel: 3, weight: 5, stab: 10, color: 0xe0e0e0 }
    ]},
    { key: 'weights', name: 'Mass Weights (ชุดถ่วงน้ำหนัก)', items: [
        { name: 'None (ไม่ติดถ่วง)', speed: 2, accel: 2, weight: 0, stab: -3, color: 0x000000 },
        { name: 'Light Weight Block (6g)', speed: -1, accel: -1, weight: 6, stab: 8, color: 0xffd54f },
        { name: 'Heavy Mass Damper (12g)', speed: -3, accel: -2, weight: 12, stab: 16, color: 0xb0bec5 }
    ]},
    { key: 'damper', name: 'Brake Pad / Damper (แผ่นแบก/เบรก)', items: [
        { name: 'No Brake', speed: 3, accel: 2, weight: 0, stab: -2, color: 0x000000 },
        { name: 'Sponge Brake Pad (Blue)', speed: -1, accel: 0, weight: 1, stab: 9, color: 0x1e88e5 }
    ]},
    { key: 'body', name: 'Body Shell (บอดี้)', items: [
        { name: 'Avante Mk.III', speed: 4, accel: 2, weight: 12, stab: 2, color: 0x1976d2 },
        { name: 'Magnum Saber', speed: 3, accel: 1, weight: 14, stab: 4, color: 0xf5f5f5 },
        { name: 'Neo-Vanquish', speed: 5, accel: 3, weight: 10, stab: 1, color: 0x388e3c }
    ]}
];

let currentStep = 0;
let carStats = { speed: 0, accel: 0, weight: 0, stab: 0 };

const carGroup = new THREE.Group();
scene.add(carGroup);

// --- 3. GARAGE BUILDER LOGIC ---
function renderUI() {
    const listEl = document.getElementById('options-list');
    listEl.innerHTML = '';
    
    if (currentStep < assemblySteps.length) {
        const step = assemblySteps[currentStep];
        document.getElementById('step-desc').innerText = `ขั้นตอนที่ ${currentStep + 1}: เลือก ${step.name}`;
        
        step.items.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'item-btn';
            btn.innerHTML = `<strong>${item.name}</strong><br><small>Spd:+${item.speed} | Acc:+${item.accel} | Wt:${item.weight}g | Stab:+${item.stab}</small>`;
            btn.onclick = () => selectPart(step.key, item);
            listEl.appendChild(btn);
        });
    } else {
        document.getElementById('step-desc').innerText = "ประกอบรถเสร็จสมบูรณ์!";
        document.getElementById('go-race-btn').style.display = 'block';
    }
}

function selectPart(stepKey, item) {
    carStats.speed += item.speed;
    carStats.accel += item.accel;
    carStats.weight += item.weight;
    carStats.stab += item.stab;
    
    document.getElementById('st-speed').innerText = carStats.speed;
    document.getElementById('st-accel').innerText = carStats.accel;
    document.getElementById('st-weight').innerText = carStats.weight + " g";
    document.getElementById('st-stab').innerText = carStats.stab;

    updateCarModel(stepKey, item);

    currentStep++;
    renderUI();
}

// สร้างชิ้นส่วน 3D ทั้งหมดอย่างสมบูรณ์ (หัวรถหันไปทาง -Z)
function updateCarModel(key, item) {
    if (key === 'chassis') {
        const geo = new THREE.BoxGeometry(0.8, 0.15, 1.8);
        const mat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.4 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.2;
        carGroup.add(mesh);
    } 
    else if (key === 'motor') {
        const mGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.35, 16);
        const mMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.7, roughness: 0.2 });
        const mMesh = new THREE.Mesh(mGeo, mMat);
        mMesh.rotation.x = Math.PI / 2;
        mMesh.position.set(0, 0.25, 0.2);
        carGroup.add(mMesh);
    }
    else if (key === 'gears') {
        const gGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.05, 16);
        const gMat = new THREE.MeshStandardMaterial({ color: item.color });
        const gMesh = new THREE.Mesh(gGeo, gMat);
        gMesh.rotation.z = Math.PI / 2;
        gMesh.position.set(0.22, 0.23, 0.4);
        carGroup.add(gMesh);
    }
    else if (key === 'shaft') {
        const sGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.4, 8);
        const sMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.9 });
        const sMesh = new THREE.Mesh(sGeo, sMat);
        sMesh.position.set(-0.2, 0.2, 0);
        carGroup.add(sMesh);
    }
    else if (key === 'bearings') {
        const bGeo = new THREE.TorusGeometry(0.05, 0.02, 8, 16);
        const bMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.8 });
        [[-0.38, 0.2, 0.5], [0.38, 0.2, 0.5], [-0.38, 0.2, -0.5], [0.38, 0.2, -0.5]].forEach(p => {
            const b = new THREE.Mesh(bGeo, bMat);
            b.rotation.y = Math.PI / 2;
            b.position.set(...p);
            carGroup.add(b);
        });
    }
    else if (key === 'wheels') {
        const wGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.12, 16);
        const wMat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.3 });
        [[-0.45, 0.24, 0.5], [0.45, 0.24, 0.5], [-0.45, 0.24, -0.5], [0.45, 0.24, -0.5]].forEach(p => {
            const w = new THREE.Mesh(wGeo, wMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...p);
            carGroup.add(w);
        });
    }
    else if (key === 'tires') {
        const tGeo = new THREE.TorusGeometry(0.25, 0.06, 12, 20);
        const tMat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.8 });
        [[-0.45, 0.24, 0.5], [0.45, 0.24, 0.5], [-0.45, 0.24, -0.5], [0.45, 0.24, -0.5]].forEach(p => {
            const t = new THREE.Mesh(tGeo, tMat);
            t.rotation.y = Math.PI / 2;
            t.position.set(...p);
            carGroup.add(t);
        });
    }
    else if (key === 'plates') {
        const pGeo = new THREE.BoxGeometry(1.5, 0.04, 0.25);
        const pMat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.5 });
        const frontPlate = new THREE.Mesh(pGeo, pMat);
        frontPlate.position.set(0, 0.15, -1.0);
        const rearPlate = new THREE.Mesh(pGeo, pMat);
        rearPlate.position.set(0, 0.15, 1.0);
        carGroup.add(frontPlate, rearPlate);
    }
    else if (key === 'rollers') {
        const rGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.04, 16);
        const rMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.8 });
        [[-0.7, 0.22, -1.0], [0.7, 0.22, -1.0], [-0.7, 0.22, 1.0], [0.7, 0.22, 1.0]].forEach(p => {
            const r = new THREE.Mesh(rGeo, rMat);
            r.position.set(...p);
            carGroup.add(r);
        });
    }
    else if (key === 'weights') {
        if (item.weight > 0) {
            const wtGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 12);
            const wtMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.9, roughness: 0.2 });
            [[-0.35, 0.25, 0], [0.35, 0.25, 0]].forEach(p => {
                const wt = new THREE.Mesh(wtGeo, wtMat);
                wt.position.set(...p);
                carGroup.add(wt);
            });
        }
    }
    else if (key === 'damper') {
        if (item.name !== 'No Brake') {
            const dGeo = new THREE.BoxGeometry(0.8, 0.05, 0.15);
            const dMat = new THREE.MeshStandardMaterial({ color: item.color });
            const dMesh = new THREE.Mesh(dGeo, dMat);
            dMesh.position.set(0, 0.08, 1.05);
            carGroup.add(dMesh);
        }
    }
    else if (key === 'body') {
        const bGeo = new THREE.BoxGeometry(0.72, 0.22, 1.3);
        const bMat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.2, metalness: 0.3 });
        const bMesh = new THREE.Mesh(bGeo, bMat);
        bMesh.position.set(0, 0.35, -0.05);
        carGroup.add(bMesh);
    }
}

// --- 4. TRACK & RACE SYSTEM ---
let isRacingMode = false;
let isRunning = false;
let isCourseOut = false;
let progress = 0;
let lap = 0;
let startTime = 0;
let elapsedTime = 0;
let raceTimer = null;

// สร้างเส้นทางรางแข่ง
const trackPoints = [
    new THREE.Vector3(-10, 0, 6),
    new THREE.Vector3(0, 0, 6),
    new THREE.Vector3(10, 0, 6),
    new THREE.Vector3(13, 0, 2),
    new THREE.Vector3(9, 0, -3),
    new THREE.Vector3(2, 0, -3),
    new THREE.Vector3(-4, 0, -3), 
    new THREE.Vector3(-9, 0, -7),
    new THREE.Vector3(-13, 0, -2),
    new THREE.Vector3(-6, 0, 2),
    new THREE.Vector3(4, 0, -6),
    new THREE.Vector3(11, 0, -6),
    new THREE.Vector3(13, 0, -1),
    new THREE.Vector3(-12, 0, 2)
];
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');

// สร้างโครงสร้างรางแข่งทรง U-Channel
function createTrackMesh() {
    const shape = new THREE.Shape();
    shape.moveTo(-0.9, 0.5);
    shape.lineTo(-0.8, 0);
    shape.lineTo(0.8, 0);
    shape.lineTo(0.9, 0.5);
    shape.lineTo(0.82, 0.5);
    shape.lineTo(0.75, 0.08);
    shape.lineTo(-0.75, 0.08);
    shape.lineTo(-0.82, 0.5);
    shape.closePath();

    const extrudeSettings = { steps: 350, bevelEnabled: false, extrudePath: trackCurve };
    const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    const material = new THREE.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.4 });
    return new THREE.Mesh(geometry, material);
}

const trackMesh = createTrackMesh();
trackMesh.visible = false;
scene.add(trackMesh);

const currentPos = new THREE.Vector3();
const targetPos = new THREE.Vector3();
const upVector = new THREE.Vector3(0, 1, 0);

function setCarOnTrack(p) {
    trackCurve.getPointAt(p, currentPos);
    trackCurve.getPointAt((p + 0.002) % 1, targetPos);

    currentPos.y += 0.1;
    targetPos.y += 0.1;

    carGroup.position.copy(currentPos);
    carGroup.up.copy(upVector);
    carGroup.lookAt(targetPos);
}

function startRaceMode() {
    showLoadingScreen("กำลังเตรียมรางแข่งและปรับมุมกล้อง...", 1000, () => {
        isRacingMode = true;
        document.getElementById('parts-selector').style.display = 'none';
        document.getElementById('stats-panel').style.display = 'none';
        document.getElementById('race-ui').style.display = 'block';
        
        grid.visible = false;
        trackMesh.visible = true;
        
        progress = 0;
        setCarOnTrack(0);

        // มุมกล้อง Top-View 
        camera.position.set(0, 32, 0.1);
        controls.target.set(0, 0, 0);
        controls.update();
    });
}

function resetGame() {
    showLoadingScreen("กำลังเปิดโรงแต่งรถ...", 600, () => {
        location.reload();
    });
}

function toggleRun() {
    const btn = document.getElementById('btn-run');
    
    if (isCourseOut) {
        // รีเซ็ตรถเข้าเส้นชัยใหม่หลังหลุดโค้ง
        isCourseOut = false;
        document.getElementById('co-message').style.display = 'none';
        carGroup.rotation.set(0, 0, 0);
        progress = 0;
        lap = 0;
        elapsedTime = 0;
        setCarOnTrack(0);
        document.getElementById('timer').innerText = "00:00:00";
        document.getElementById('lap-counter').innerText = `Lap: 0 / 3`;
    }

    isRunning = !isRunning;
    
    if (isRunning) {
        btn.innerText = "หยุดรถ";
        btn.style.background = "#ff9800";
        if (lap >= 3) { 
            lap = 0; 
            progress = 0; 
            elapsedTime = 0; 
            document.getElementById('timer').innerText = "00:00:00";
        }
        document.getElementById('lap-counter').innerText = `Lap: ${lap} / 3`;
        startTime = Date.now() - elapsedTime;
        raceTimer = setInterval(updateTimer, 10);
    } else {
        btn.innerText = "ปล่อยรถ";
        btn.style.background = "#e53935";
        elapsedTime = Date.now() - startTime;
        clearInterval(raceTimer);
    }
}

function updateTimer() {
    const diff = Date.now() - startTime;
    const ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
    const sec = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
    const min = Math.floor(diff / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${min}:${sec}:${ms}`;
}

// --- 5. ANIMATION LOOP & PHYSICS ---
function animate() {
    requestAnimationFrame(animate);

    if (isRacingMode && isRunning && !isCourseOut) {
        const runSpeed = 0.0006 + (carStats.speed * 0.00006);
        progress += runSpeed;

        // ระบบตรวจสอบคำนวณการหลุดโค้ง (Course Out Physics)
        const requiredStab = (carStats.speed * 1.1) - (carStats.weight * 0.15);
        if (requiredStab > carStats.stab && Math.random() < 0.003) {
            triggerCourseOut();
        }

        if (progress >= 1) {
            progress -= 1;
            lap++;
            document.getElementById('lap-counter').innerText = `Lap: ${Math.min(lap, 3)} / 3`;
            
            if (lap >= 3) {
                isRunning = false;
                clearInterval(raceTimer);
                document.getElementById('btn-run').innerText = "ปล่อยรถอีกครั้ง";
                document.getElementById('btn-run').style.background = "#e53935";
                setTimeout(() => alert(`🏁 เข้าเส้นชัยสำเร็จ! เวลาทั้งหมด: ${document.getElementById('timer').innerText}`), 100);
            }
        }

        if (!isCourseOut) {
            setCarOnTrack(progress);
        }
    } else if (isCourseOut) {
        // แอนิเมชันรถหมุนกระเด็นออกนอกราง
        carGroup.position.x += 0.08;
        carGroup.position.y += 0.05;
        carGroup.rotation.x += 0.2;
        carGroup.rotation.z += 0.2;
    }

    controls.update();
    renderer.render(scene, camera);
}

function triggerCourseOut() {
    isCourseOut = true;
    isRunning = false;
    clearInterval(raceTimer);
    document.getElementById('co-message').style.display = 'block';
    document.getElementById('btn-run').innerText = "วางรถใหม่";
    document.getElementById('btn-run').style.background = "#e53935";
}

renderUI();
animate();

window.addEventListener('load', () => {
    setTimeout(hideLoadingScreen, 800);
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
