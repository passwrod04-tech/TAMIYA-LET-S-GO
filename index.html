<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini 4WD Real Assembly & Track</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; background: #111; color: #fff; }
        #canvas-container { width: 100vw; height: 60vh; }
        #ui-panel { width: 100vw; height: 40vh; background: #222; border-top: 3px solid #ff4444; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .step-title { font-size: 1.2rem; color: #ffeb3b; }
        .item-desc { font-size: 0.85rem; color: #ccc; height: 45px; background: #333; padding: 8px; border-radius: 4px; margin-top: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        button { background: #ff4444; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        button:hover { background: #ff6666; }
        button.active { background: #4caf50; }
        #track-select-screen { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #race-ui { display: none; position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; font-size: 1.2rem; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <div>
            <div id="step-name" class="step-title">ขั้นตอนที่ 1: เลือก Chassis</div>
            <div id="item-info" class="item-desc">เลือกลักษณะโครงรถหลักเพื่อเริ่มประกอบ</div>
        </div>
        <div id="options-container" class="btn-group"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
            <button id="prev-btn" onclick="prevStep()">ย้อนกลับ</button>
            <button id="next-btn" onclick="nextStep()">ขั้นตอนถัดไป</button>
        </div>
    </div>

    <div id="track-select-screen">
        <h2>เลือกสนามแข่ง Tamiya (3 สนาม)</h2>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button onclick="selectTrack(1)">สนาม 1: High-Speed Circuit (ทางตรง)</button>
            <button onclick="selectTrack(2)">สนาม 2: Technical Curve (ทางโค้ง)</button>
            <button onclick="selectTrack(3)">สนาม 3: Slope Jump (ทางเนินกระโดด)</button>
        </div>
    </div>

    <div id="race-ui">
        <div>สนาม: <span id="track-name">Track 1</span></div>
        <div>เวลาที่ใช้ (3 รอบ): <span id="timer">0.00</span> วินาที</div>
        <button id="start-btn" onclick="startRace()" style="margin-top: 10px;">ปล่อยรถแข่ง!</button>
        <button onclick="resetToBuild()" style="margin-top: 10px; background:#555;">กลับไปแต่งรถ</button>
    </div>

<script>
const buildSteps = [
    { name: "Chassis", items: [
        { name: "AR Chassis", desc: "แชสซีมอเตอร์หลัง ศูนย์ถ่วงดีเยี่ยม", color: 0x333333, speedMult: 1.0 },
        { name: "MS Chassis", desc: "แชสซีมอเตอร์กลาง สมดุลส่งกำลังดี", color: 0x555555, speedMult: 1.05 }
    ]},
    { name: "Motor", items: [
        { name: "Atomic-Tuned (เขียว)", desc: "สายสมดุล ควบคุมง่าย สมดุลสปีดแรงบิด", color: 0x2e7d32, speedMult: 1.1 },
        { name: "Mach-Dash (แดง)", desc: "รอบจัด รอบ RPM สูง เน้นทางตรง", color: 0xc62828, speedMult: 1.4 }
    ]},
    { name: "Gear Set", items: [
        { name: "3.5:1 (เขียว/ชมพู)", desc: "เฟืองสปีดเน้นความเร็วปลายทางตรง", color: 0xf48fb1, speedMult: 1.25 },
        { name: "4:1 (ฟ้า/ส้ม)", desc: "เฟืองแรงบิดเน้นอัตราเร่งขึ้นเนิน", color: 0xffb74d, speedMult: 1.0 }
    ]},
    { name: "Wheel & Tire", items: [
        { name: "Small + Maroon Tire", desc: "ล้อเล็กยางลื่น ยึดเกาะปานกลาง ไม่เด้ง", color: 0x880e4f, speedMult: 1.0 },
        { name: "Large + Super Hard", desc: "ล้อใหญ่ยางแข็ง ความเร็วปลายสูง", color: 0x212121, speedMult: 1.2 }
    ]},
    { name: "Bumper & Roller", items: [
        { name: "FRP + Plastic Rollers", desc: "ชุดกันชนสเปกเริ่มต้น ทานแรงเสียดทานปานกลาง", color: 0x9e9e9e, speedMult: 1.0 },
        { name: "Carbon + Aluminum", desc: "กันชนคาร์บอนและลูกกลิ้งอลูมิเนียม ลื่นนิ่ง", color: 0x111111, speedMult: 1.15 }
    ]},
    { name: "Body Shell", items: [
        { name: "Avante Jr. Body", desc: "ครอบบอดี้แอโรสปอร์ตคลาสสิก", color: 0x1565c0, speedMult: 1.0 },
        { name: "Neo Vanquish Body", desc: "ครอบบอดี้ดีไซน์โฉบเฉี่ยว", color: 0xd32f2f, speedMult: 1.0 }
    ]}
];

let currentStep = 0;
let carConfig = {};
let parts = {};

// --- ตั้งค่าระบบ 3D Canvas ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.6), 0.1, 1000);
camera.position.set(3, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight * 0.6);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// แสงสว่าง
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5, 10, 5);
scene.add(light);

// ตัวกลุ่มโมเดลรถแข่ง
const carGroup = new THREE.Group();
scene.add(carGroup);

function clearPartsFromStep(stepIndex) {
    for (let i = stepIndex; i < buildSteps.length; i++) {
        const stepName = buildSteps[i].name;
        if (parts[stepName]) {
            carGroup.remove(parts[stepName]);
            delete parts[stepName];
            delete carConfig[stepName];
        }
    }
}

function updateAssemblyVisual(stepIndex, selectedItem) {
    clearPartsFromStep(stepIndex);
    carConfig[buildSteps[stepIndex].name] = selectedItem;

    const mat = new THREE.MeshStandardMaterial({ color: selectedItem.color });
    const stepName = buildSteps[stepIndex].name;

    if (stepIndex === 0) { // Chassis
        const geo = new THREE.BoxGeometry(1.2, 0.25, 2.2);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.2;
        parts[stepName] = mesh;
    } 
    else if (stepIndex === 1) { // Motor
        const geo = new THREE.CylinderGeometry(0.2, 0.2, 0.6, 16);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.z = Math.PI / 2;
        mesh.position.set(0, 0.35, 0);
        parts[stepName] = mesh;
    }
    else if (stepIndex === 2) { // Gear
        const geo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0.3, 0.35, -0.3);
        parts[stepName] = mesh;
    }
    else if (stepIndex === 3) { // Wheel & Tire
        const wheelsGroup = new THREE.Group();
        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.15, 16);
        const positions = [[-0.7, 0.3, 0.8], [0.7, 0.3, 0.8], [-0.7, 0.3, -0.8], [0.7, 0.3, -0.8]];
        positions.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, mat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            wheelsGroup.add(w);
        });
        parts[stepName] = wheelsGroup;
    }
    else if (stepIndex === 4) { // Bumper & Roller
        const bumperGroup = new THREE.Group();
        const plateGeo = new THREE.BoxGeometry(1.8, 0.05, 0.2);
        const plateFront = new THREE.Mesh(plateGeo, mat);
        plateFront.position.set(0, 0.2, 1.2);
        const plateRear = new THREE.Mesh(plateGeo, mat);
        plateRear.position.set(0, 0.2, -1.2);
        bumperGroup.add(plateFront);
        bumperGroup.add(plateRear);
        parts[stepName] = bumperGroup;
    }
    else if (stepIndex === 5) { // Body Shell
        const geo = new THREE.ConeGeometry(0.5, 1.5, 4);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(0, 0.6, 0);
        parts[stepName] = mesh;
    }

    if (parts[stepName]) {
        carGroup.add(parts[stepName]);
    }
}

function updateUI() {
    const step = buildSteps[currentStep];
    document.getElementById('step-name').innerText = `ขั้นตอนที่ ${currentStep + 1}: เลือก ${step.name}`;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    const selectedItem = carConfig[step.name] || step.items[0];

    step.items.forEach((item) => {
        const btn = document.createElement('button');
        btn.innerText = item.name;
        if (item.name === selectedItem.name) btn.classList.add('active');
        btn.onclick = () => {
            Array.from(container.children).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('item-info').innerText = item.desc;
            updateAssemblyVisual(currentStep, item);
        };
        container.appendChild(btn);
    });
    
    document.getElementById('item-info').innerText = selectedItem.desc;
    updateAssemblyVisual(currentStep, selectedItem);
}

function nextStep() {
    if (currentStep < buildSteps.length - 1) {
        currentStep++;
        updateUI();
    } else {
        document.getElementById('track-select-screen').style.display = 'flex';
    }
}

function prevStep() {
    if (currentStep > 0) {
        currentStep--;
        updateUI();
    }
}

// --- ระบบสร้างสนามและมุมมอง Top-View ---
let trackMesh;
let selectedTrackId = 1;

function selectTrack(trackId) {
    selectedTrackId = trackId;
    document.getElementById('track-select-screen').style.display = 'none';
    document.getElementById('ui-panel').style.display = 'none';
    document.getElementById('race-ui').style.display = 'block';
    document.getElementById('track-name').innerText = `สนามที่ ${trackId}`;
    
    if (trackMesh) scene.remove(trackMesh);

    let trackGeo;
    if (trackId === 1) {
        trackGeo = new THREE.TorusGeometry(4, 0.6, 16, 100);
    } else if (trackId === 2) {
        trackGeo = new THREE.TorusGeometry(3, 0.8, 16, 50);
    } else {
        trackGeo = new THREE.TorusGeometry(5, 0.5, 16, 100);
    }

    const trackMat = new THREE.MeshStandardMaterial({ color: 0x444444, wireframe: false });
    trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.rotation.x = Math.PI / 2;
    scene.add(trackMesh);

    // ล็อกมุมกล้อง Top-View ให้สมบูรณ์
    controls.enabled = false;
    camera.position.set(0, 14, 0);
    controls.target.set(0, 0, 0);
    controls.update();
}

let isRacing = false;
let raceTime = 0;
let angle = 0;

function startRace() {
    if (isRacing) return;
    isRacing = true;
    raceTime = 0;
    angle = 0;
    document.getElementById('start-btn').disabled = true;

    // คำนวณตัวคูณความเร็วจากสเปกรถที่ประกอบ
    let totalSpeedMult = 1.0;
    Object.values(carConfig).forEach(item => {
        if (item.speedMult) totalSpeedMult *= item.speedMult;
    });

    const radius = selectedTrackId === 2 ? 3 : (selectedTrackId === 3 ? 5 : 4);
    const speed = 0.04 * totalSpeedMult;

    const interval = setInterval(() => {
        if (!isRacing) { clearInterval(interval); return; }
        raceTime += 0.03;
        document.getElementById('timer').innerText = raceTime.toFixed(2);
        
        angle += speed;
        carGroup.position.x = Math.cos(angle) * radius;
        carGroup.position.z = Math.sin(angle) * radius;
        carGroup.rotation.y = -angle;

        if (angle >= Math.PI * 6) { // วิ่งครบ 3 รอบ
            isRacing = false;
            clearInterval(interval);
            document.getElementById('start-btn').disabled = false;
            alert(`เข้าเส้นชัยแล้ว! เวลา 3 รอบ: ${raceTime.toFixed(2)} วินาที`);
        }
    }, 30);
}

function resetToBuild() {
    isRacing = false;
    document.getElementById('start-btn').disabled = false;
    if (trackMesh) scene.remove(trackMesh);
    
    carGroup.position.set(0, 0, 0);
    carGroup.rotation.set(0, 0, 0);
    
    document.getElementById('ui-panel').style.display = 'flex';
    document.getElementById('race-ui').style.display = 'none';
    currentStep = 0;
    
    controls.enabled = true;
    camera.position.set(3, 2, 4);
    controls.target.set(0, 0, 0);
    controls.update();
    
    updateUI();
}

function animate() {
    requestAnimationFrame(animate);
    if (controls.enabled) controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / (window.innerHeight * 0.6);
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight * 0.6);
});

updateUI();
animate();
</script>
</body>
</html>
